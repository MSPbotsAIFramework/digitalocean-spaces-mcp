[project]
name = "digitalocean-spaces-mcp"
version = "0.1.0"
description = "MCP server exposing DigitalOcean Spaces (S3-compatible object storage) as agent tools"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp[cli]>=1.9.0,<2.0.0",
    "boto3>=1.34.0,<2.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "uvicorn>=0.30.0,<1.0.0",
    "starlette>=0.38.0,<1.0.0",
]

[project.scripts]
digitalocean-spaces-mcp = "digitalocean_spaces_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "moto[s3]>=5.0.0,<6.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digitalocean_spaces_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
