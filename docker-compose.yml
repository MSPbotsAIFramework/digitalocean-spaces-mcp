# Local debugging only — not used by CI or deployment. Credentials are
# supplied per-request via headers (see README), never via environment
# variables here (SOP §3.1): this file carries no credential fields.
services:
  digitalocean-spaces-mcp:
    build: .
    ports:
      - "8080:8080"
    environment:
      MCP_HTTP_HOST: "0.0.0.0"
      MCP_HTTP_PORT: "8080"
